name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script_stop: true
          command_timeout: 15m

          script: |
            set -euo pipefail

            echo "========================================="
            echo " Starting Backend Deployment"
            echo " Server: $(hostname)"
            echo " Time:   $(date)"
            echo "========================================="

            APP_DIR="/home/ubuntu/apps/fullstack-ecommerce/backend"

            echo "→ Moving to backend directory..."
            cd "$APP_DIR"

            echo "→ Syncing server code with origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Ensuring Python virtual environment exists..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            echo "→ Activating virtual environment..."
            source venv/bin/activate

            echo "→ Upgrading pip tooling..."
            pip install --upgrade pip setuptools wheel

            echo "→ Installing dependencies..."
            pip install --upgrade -r requirements.txt

            echo "→ Running Django production safety checks..."
            python3 manage.py check --deploy

            echo "→ Applying database migrations..."
            python3 manage.py migrate --noinput

            echo "→ Collecting static files..."
            python3 manage.py collectstatic --noinput

            echo "→ Restarting Gunicorn service..."
            sudo systemctl restart gunicorn

            echo "→ Reloading Nginx..."
            sudo systemctl reload nginx

            echo "→ Waiting briefly for services to come up..."
            sleep 2

            echo "→ Running internal health check (Gunicorn)..."
            curl -f http://127.0.0.1:8000/api/health/

            echo "→ Running public health check (Nginx + SSL)..."
            curl -f https://noirel.duckdns.org/api/health/

            echo "========================================="
            echo " Backend Deployment Successful"
            echo "========================================="
