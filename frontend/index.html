<!doctype html>
<html lang="en">

<head>
  <!--  Basic Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!--  Primary SEO -->
  <title>Noirel | Luxury Perfumes & Exclusive Fragrances</title>
  <meta name="description"
    content="Indulge in luxury with Noirel Perfumes — a collection of handcrafted fragrances designed for elegance, confidence, and timeless allure." />
  <meta name="keywords"
    content="Noirel, luxury perfumes, premium fragrances, scent collection, eau de parfum, perfume store, exclusive scents" />
  <meta name="author" content="Noirel" />
  <meta name="robots" content="index, follow" />

  <!--  Theme + Manifest (PWA) -->
  <meta name="theme-color" content="#000000" />


  <!-- Favicon + Icons -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-96x96.png" />

  <!--  Open Graph (Facebook / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://noire-perfumes.vercel.app/" />
  <meta property="og:title" content="Noirel | Luxury Perfumes" />
  <meta property="og:description"
    content="Experience sophistication with Noirel's exclusive range of luxury perfumes for men and women." />
  <meta property="og:image" content="https://noire-perfumes.vercel.app/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Noirel | Luxury Perfumes" />
  <meta name="twitter:description"
    content="Discover timeless elegance through Noirel’s signature fragrances — crafted to define your essence." />
  <meta name="twitter:image" content="https://noire-perfumes.vercel.app/og-image.jpg" />

  <!--Preconnects (Performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Example: custom font -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" /> -->

  <!-- Canonical (SEO best practice) -->
  <link rel="canonical" href="https://noire-perfumes.vercel.app/" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
